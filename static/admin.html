<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VolksVision Studio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/admin.webmanifest">
<link rel="icon" href="/img/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VV Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d0c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a phone app. One screen per tab, tab bar pinned to the bottom (thumb reach),
   editors open as full-screen sheets with the Save button pinned above the keyboard area. */
:root{--paper:#0b0d0c;--ink:#eef0ec;--muted:#99a29d;--rule:#262c29;--sea:#f2a93b;--signal:#f2a93b;--frame:#131715;
  --ok:#7fd1a0;--warn:#f2c46b;--bad:#ff8a7a;
  --body:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --tabbar:64px;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px} /* 16px+ stops iOS from zooming into fields */
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
h1{font-size:28px;margin:0;line-height:1;font-stretch:125%;text-transform:uppercase;font-weight:800}
h2{font-size:19px;margin:0}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:11px 18px;cursor:pointer;min-height:44px;font-weight:500}
.btn.solid{background:var(--ink);color:var(--paper)}
a.btn{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
.btn.sea{background:var(--sea);border-color:var(--sea);color:#0b0d0c}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5}
.link{background:none;border:0;padding:8px 0;color:var(--sea);text-decoration:underline;cursor:pointer;min-height:44px}

/* Screens */
.screen{max-width:760px;margin:0 auto;padding-inline:16px;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 24px)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--frame);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{background:none;border:0;height:var(--tabbar);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer}
.tabbar svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] svg{color:var(--sea)}
.badge{font-family:var(--mono);font-size:10px;background:var(--signal);color:#16201d;border-radius:999px;padding:0 6px;margin-left:2px}

/* Lists */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--frame);border:1px solid var(--rule);padding:12px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--rule);background:transparent;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:15px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.row{all:unset;max-width:100%;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--rule);min-height:64px;width:100%}
.row:focus-visible{outline:2px solid var(--sea)}
.thumb{width:52px;height:52px;background:var(--frame);border:1px solid var(--rule);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:70%;height:70%}
.r-main{min-width:0}
.r-main strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sub{display:block;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-end{text-align:right;font-family:var(--mono);font-size:14px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.p-new,.p-live{color:var(--sea)}.p-awaiting_payment,.p-draft{color:var(--warn)}.p-paid{color:var(--ok)}.p-shipped,.p-delivered,.p-hidden{color:var(--muted)}.p-cancelled{color:var(--bad)}
.empty{color:var(--muted);padding:28px 2px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.fab{position:fixed;right:16px;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 16px);z-index:4;border-radius:999px;padding:14px 20px;box-shadow:0 6px 20px rgb(0 0 0 / .18)}

.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;border-bottom:1px solid var(--rule)}
.prow .row{border-bottom:0}
.prow .r-main strong{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.2}
@media (max-width:480px){.prow .row{grid-template-columns:minmax(0,1fr) auto;gap:8px}.prow .thumb{display:none}.prow .act-btn{min-width:40px;padding:0 8px}}
.row-acts{display:flex;gap:6px}
.act-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;padding:0 10px;border:1px solid var(--rule);border-radius:10px;background:var(--frame);color:var(--ink);cursor:pointer;font-size:14px;font-weight:600}
.act-btn span{display:none}
.act-btn.del{color:var(--bad)}
.act-btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.act-btn.armed span{display:inline}
.archive{margin-top:24px;border:1px solid var(--rule);border-radius:10px;padding:4px 12px}
.archive summary{cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:12px 2px;list-style:none}
.archive summary::-webkit-details-marker{display:none}
.archive .list{border-top:1px solid var(--rule)}
.archive .prow:last-child{border-bottom:0}
@media (min-width:1024px){.act-btn span{display:inline}.act-btn:hover{border-color:var(--ink)}.screen{padding-bottom:120px}}
/* Socials */
.soc-card{gap:12px}
.soc{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--rule);padding-top:12px}
.soc-in{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
.soc-in b{padding-left:12px;color:var(--muted);font-weight:600}
.field .soc-in input{border:0;background:transparent;padding-left:4px}
.soc-meta{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.soc-meta .link{min-height:0;padding:0;flex:none;font-size:14px}
/* Photo editor */
.pe{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;color:var(--ink)}
.pe-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:var(--frame);border-bottom:1px solid var(--rule)}
.pe-bar h2{font-size:16px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pe-stage{position:relative;flex:1;min-height:0;touch-action:none;overflow:hidden;cursor:grab}
.pe-canvas{position:absolute;inset:0}
.pe-frame{position:absolute;box-shadow:0 0 0 100vmax rgb(0 0 0 / .62);outline:2px solid #fff;pointer-events:none;background-image:linear-gradient(rgb(255 255 255 / .25) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255 / .25) 1px,transparent 1px);background-size:33.34% 33.34%;background-position:-1px -1px}
.pe-tools{background:var(--frame);border-top:1px solid var(--rule);padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:10px;max-width:760px;width:100%;margin:0 auto}
.pe-tools .chips{margin-bottom:0}
@media (min-width:1024px){.pe{inset:24px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 100vmax rgb(0 0 0 / .6)}}
/* Sheets (editors) */
.sheet{position:fixed;inset:0;z-index:10;background:var(--paper);display:flex;flex-direction:column}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;border-bottom:1px solid var(--rule);background:var(--frame)}
.sheet-bar h2{font-size:17px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet-inner{max-width:760px;margin:0 auto;padding:16px 16px 32px;display:flex;flex-direction:column;gap:16px}
.sheet-foot{border-top:1px solid var(--rule);background:var(--frame);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:10px}
.sheet-foot .btn{flex:1}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:14px;font-weight:500}
.field small{color:var(--muted);font-size:13px}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--rule);border-radius:8px;background:var(--frame)}
.field textarea{min-height:120px;resize:vertical;line-height:1.5}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--rule);border-radius:8px;background:var(--frame);cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--sea)}
.photo{border:1.5px dashed var(--rule);border-radius:10px;background:var(--frame);display:grid;place-items:center;aspect-ratio:4/3;overflow:hidden;position:relative;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .ph{color:var(--muted);text-align:center;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.photo-actions{display:flex;gap:10px;flex-wrap:wrap}
.toolbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.toolbar button{flex:none;min-width:44px;min-height:40px;border:1px solid var(--rule);background:var(--frame);border-radius:8px;cursor:pointer;font-weight:500}
.body-edit{min-height:42vh!important;font-size:16px}
.preview{background:var(--frame);border:1px solid var(--rule);border-radius:8px;padding:16px;min-height:42vh}
.preview h2{font-size:22px;margin:1em 0 .3em}.preview h3{font-size:18px}
.preview p,.preview ul,.preview ol{margin:0 0 1em}.preview a{color:var(--sea)}
.preview blockquote{margin:1em 0;padding-left:14px;border-left:3px solid var(--signal);color:var(--muted)}
.checks{display:flex;flex-direction:column;gap:6px;background:var(--frame);border:1px solid var(--rule);border-radius:8px;padding:12px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--warn)}
.dot.ok{background:var(--ok)}
.score{font-family:var(--mono);font-size:13px}
.topic{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:10px;border:1px solid var(--rule);border-radius:8px;background:var(--frame)}
.order-items{width:100%;border-collapse:collapse;font-size:15px}
.order-items td{padding:6px 0;border-bottom:1px solid var(--rule)}
.order-items td:last-child{text-align:right;font-family:var(--mono)}
.copyable{user-select:all;word-break:break-word}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 16px);z-index:20;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;max-width:min(92vw,520px);font-size:15px;box-shadow:0 6px 20px rgb(0 0 0 / .2)}
.toast.err{background:var(--bad);color:#fff}
.login{max-width:400px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12vh) 16px 32px;display:flex;flex-direction:column;gap:14px}
.pw{position:relative;display:block}.pw input{padding-right:76px!important}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--sea);font-weight:600;font-size:15px;padding:8px 10px;min-height:40px;cursor:pointer}
.login input[type=password],.login #token{padding:14px;border:1px solid var(--rule);border-radius:8px;background:var(--frame)}
.err{color:var(--bad);font-size:15px;margin:0;min-height:1.3em}
.loading{color:var(--muted);padding:24px 2px}
.help-btn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:6;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--rule);background:var(--frame);color:var(--ink);font:800 18px var(--body);cursor:pointer}
.tip-scrim{position:fixed;inset:0;z-index:30;background:rgb(0 0 0 / .55);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 16px)}
.tip{width:min(100%,520px);background:var(--frame);border:1.5px solid var(--signal);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgb(0 0 0 / .4);animation:tipIn .2s ease-out}
@keyframes tipIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.tip{animation:none}}
.tip h2{font-size:20px;text-transform:uppercase;font-stretch:118%}
.tip{max-height:calc(100dvh - 32px);overflow-y:auto}
.ask{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--rule);padding-top:12px;margin-top:2px}
.ask-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.ask-row input{padding:11px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);min-width:0}
.ask-ans{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.ask-ans ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.guide-list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.guide-list button{all:unset;cursor:pointer;display:block;padding:9px 2px;border-bottom:1px solid var(--rule);font-size:15px}
.tip ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tip-actions{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:4px}
.top{padding-right:48px}
.stage{position:sticky;top:0;z-index:2;width:min(100%,300px,calc(42vh * 9 / 16));aspect-ratio:9/16;margin:0 auto;background:#000;border-radius:12px;overflow:hidden}
.stage canvas{width:100%;height:100%;display:block}
.range-pair{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-family:var(--mono);font-size:12px}
.range-pair input{width:100%;accent-color:var(--signal)}
.steps{display:flex;gap:6px;margin-bottom:4px}.steps span{flex:1;height:4px;border-radius:4px;background:var(--rule)}.steps span.on{background:var(--signal)}
.post-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--rule);border-radius:10px;background:var(--frame)}
.post-row.done{border-color:var(--ok)}
.big-cta{width:100%;font-size:18px;min-height:56px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-bottom:16px}
.seg button{background:none;border:0;padding:10px 4px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted);min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.card{background:var(--frame);border:1px solid var(--rule);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.md h2{font-size:18px;margin:.8em 0 .2em}.md p,.md ul,.md ol{margin:0 0 .7em}.md blockquote{margin:.6em 0;padding-left:12px;border-left:3px solid var(--signal);color:var(--muted)}
.progress{height:8px;background:var(--rule);border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:var(--signal)}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--rule)}
.task input{width:24px;height:24px;accent-color:var(--signal)}
.task.done .t-text{text-decoration:line-through;color:var(--muted)}
.t-text{background:none;border:0;text-align:left;padding:4px 0;cursor:pointer;color:inherit;min-height:40px}
.week-h{margin:18px 0 4px}
.delta{font-family:var(--mono);font-size:12px}.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
.ntable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.ntable th,.ntable td{padding:8px 4px;border-bottom:1px solid var(--rule);text-align:right}
.ntable th:first-child,.ntable td:first-child{text-align:left}
.ntable th{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Desktop: same Studio, laid out for a big screen. Sidebar instead of the bottom tab bar,
   wider content, editors slide in from the right instead of covering everything. */
.side-brand,.side-foot{display:none}
@media (min-width:1024px){
  :root{--tabbar:0px;--side:240px}
  body{font-size:16px}
  .tabbar{top:0;bottom:0;right:auto;width:var(--side);display:flex;flex-direction:column;gap:2px;padding:24px 14px;border-top:0;border-right:1px solid var(--rule)}
  .tabbar button{height:auto;min-height:46px;flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 14px;border-radius:10px;font-size:15px}
  .tabbar button:hover{background:var(--paper);color:var(--ink)}
  .tabbar button[aria-current="page"]{background:var(--paper)}
  .tabbar svg{width:20px;height:20px}
  .side-brand{display:flex;align-items:center;gap:10px;padding:4px 14px 22px;margin-bottom:8px;border-bottom:1px solid var(--rule)}
  .side-brand b{font-size:18px;font-stretch:125%;text-transform:uppercase;font-weight:800;line-height:1}
  .side-foot{display:block;margin-top:auto;padding:14px;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0}
  .side-foot a{color:var(--muted)}
  .screen{margin-left:var(--side);max-width:calc(1120px + var(--side));padding:40px 48px 64px}
  .screen>*{max-width:1120px}
  h1{font-size:40px}
  .top{margin-bottom:24px;padding-right:56px}
  .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .seg{max-width:720px}
  .help-btn{top:28px;right:32px}
  .fab{right:40px;bottom:32px}
  .tip-scrim{align-items:center}
  /* editor drawer */
  .sheet{left:auto;width:min(720px,100vw - var(--side));border-left:1px solid var(--rule);box-shadow:0 0 0 100vmax rgb(0 0 0 / .55)}
  .sheet-inner{padding:24px 28px 40px}
  .sheet .photo{max-width:440px}
  .sheet-foot{padding:14px 28px}
  .sheet-foot .btn{flex:0 1 auto;min-width:160px}
  .sheet-foot{justify-content:flex-end}
  /* sign-in: split screen */
  .login{max-width:none;min-height:100vh;margin:0;padding:0;display:grid;grid-template-columns:1.1fr 1fr;gap:0}
  .login-art{display:flex!important}
  .login-panel{display:flex;flex-direction:column;justify-content:center;gap:16px;padding:48px max(48px,8vw);max-width:620px}
  .login .phone-only{display:none}
}
.login-art{display:none;position:relative;overflow:hidden;background:var(--frame);border-right:1px solid var(--rule);flex-direction:column;justify-content:flex-end;padding:56px}
.login-art .ghost{position:absolute;inset:auto 0 22% 6%;font-size:min(22vw,380px);line-height:.8;font-weight:900;font-stretch:125%;color:transparent;-webkit-text-stroke:1.5px #2b322e;letter-spacing:-.02em;user-select:none}
.login-art h2{position:relative;font-size:clamp(40px,4.4vw,72px);line-height:.95;text-transform:uppercase;font-stretch:125%;font-weight:800}
.login-art h2 em{color:var(--signal);font-style:italic}
.login-art p{position:relative;color:var(--muted);max-width:44ch;margin:18px 0 0}
.login-panel{display:flex;flex-direction:column;gap:14px}
</style>
</head><body>

<script type="module">
import { markdown, wordCount, plainText } from "/js/markdown.js";
import { analyze, score, PILLARS as V_PILLARS, HOOKS } from "/js/analytics.js";
import { HELP, FAQ } from "/js/studio-guide.js";

const $ = s => document.querySelector(s);
$("#showPw").addEventListener("click", e => { const t = $("#token"), show = t.type === "password"; t.type = show ? "text" : "password"; e.currentTarget.textContent = show ? "Hide" : "Show"; e.currentTarget.setAttribute("aria-pressed", String(show)); t.focus(); });
if (matchMedia("(min-width:1024px)").matches) $("#rememberLabel").textContent = "Keep me signed in on this computer";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = n => "$" + Number(n || 0).toFixed(2);
const today = () => new Date().toISOString().slice(0, 10);
const ORDER_STATUSES = [["new", "New"], ["awaiting_payment", "Awaiting payment"], ["paid", "Paid, to ship"], ["shipped", "Shipped"], ["delivered", "Delivered"], ["cancelled", "Cancelled"]];
const ART = ["tee", "hoodie", "cap", "sticker", "key", "print"];
// Spreadsheet-safe cell: quotes escaped, and a leading = + - @ can't run as a formula in Excel or Sheets.
const csvCell = v => { let s = typeof v === "object" && v ? JSON.stringify(v) : String(v ?? ""); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return `"${s.replace(/"/g, '""')}"`; };
const statusLabel = s => (ORDER_STATUSES.find(x => x[0] === s) || [s, s])[1];

// ---------- session ----------
const store = { get(k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v, keep) { try { (keep ? localStorage : sessionStorage).setItem(k, v); } catch (e) {} },
  clear(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} } };
let token = store.get("vv-admin") || "";
const state = { events: null, money: null, moneyView: "overview", tab: "grow", orders: null, products: null, posts: null, settings: null, audience: null, plan: null, videos: null, coach: null, crew: null, orderFilter: "open", postFilter: "all", growView: "today", planView: "playbook", ideaStage: "idea" };
const dataKey = tab => tab === "build" ? "settings" : tab === "grow" ? "plan" : tab;

async function api(path, { method = "GET", body, raw, type } = {}) {
  const res = await fetch("/api/admin/" + path, { method,
    headers: { Authorization: "Bearer " + token, ...(raw ? { "Content-Type": type } : body ? { "Content-Type": "application/json" } : {}) },
    body: raw || (body ? JSON.stringify(body) : undefined) });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { lock("That passphrase didn't work."); throw new Error("locked"); }
  if (!res.ok) throw new Error(data.error || "Something went wrong. Try again.");
  return data;
}
function lock(msg) {
  token = ""; store.clear("vv-admin");
  $("#appView").hidden = true; $("#sheet").hidden = true; $("#loginView").hidden = false; $("#helpBtn").hidden = true;
  $("#loginErr").textContent = msg || "";
}
let toastTimer;
function toast(msg, err = false) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, err ? 5000 : 3200);
}
const savedMsg = live => live ? "Saved. Live on the site in about a minute." : "Saved. It'll show on the site after the next refresh.";
const fail = e => { if (e.message !== "locked") toast(e.message, true); };

// ---------- tabs ----------
function go(tab) {
  state.tab = tab;
  document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  render();
  if (state[dataKey(tab)] === null) load(dataKey(tab));
  if (tab === "build" && state.events === null) load("events");
  if (tab === "orders") ["money", "settings", "audience"].forEach(k => { if (state[k] === null) load(k); });
  if (tab === "grow") ["videos", "coach", "audience", "crew", "settings", "events"].forEach(k => { if (state[k] === null) load(k); });
  if (tab === "settings") ["audience", "crew"].forEach(k => { if (state[k] === null) load(k); });
  window.scrollTo(0, 0);
}
async function load(tab) {
  try { state[tab] = await api(tab); render(); } catch (e) { fail(e); }
}
function render() {
  const s = $("#screen");
  const data = state[dataKey(state.tab)];
  if (data === null) { s.innerHTML = `<div class="loading">Loading…</div>`; return; }
  if (state.tab === "grow" && (state.videos === null || state.coach === null)) { s.innerHTML = `<div class="loading">Loading…</div>`; return; }
  s.innerHTML = ({ orders: moneyView, products: productsView, posts: postsView, build: buildView, grow: growView, settings: settingsView })[state.tab]();
  $("#helpBtn").hidden = false;
  if (!s.querySelector(".loading")) setTimeout(() => { if ($("#sheet").hidden) showTip(tipKey()); }, 250);
  const n = (state.orders || []).filter(o => o.status === "new").length;
  $("#newBadge").hidden = !n; $("#newBadge").textContent = n;
}

// ---------- orders ----------
const isOpen = o => ["new", "awaiting_payment", "paid"].includes(o.status);
// ---------- Money ----------
const DEAL_STAGES = [["pitched", "Pitched"], ["negotiating", "Talking"], ["signed", "Signed"], ["delivered", "Delivered"], ["paid", "Paid"], ["lost", "Lost"]];
const SOURCES = [["sponsor", "Sponsor"], ["creator", "Creator payout"], ["affiliate", "Affiliate"], ["merch", "Merch (outside the site)"], ["other", "Other"]];
const ym = d => String(d || "").slice(0, 7);
const usd = n => "$" + Math.round(Number(n) || 0).toLocaleString();
function moneyByMonth(month) {
  const o = (state.orders || []).filter(x => ["paid", "shipped", "delivered"].includes(x.status) && ym(x.created_at) === month).reduce((a, x) => a + Number(x.total), 0);
  const inc = (state.money?.income || []).filter(x => ym(x.received_on) === month);
  const by = k => inc.filter(x => x.source === k).reduce((a, x) => a + Number(x.amount), 0);
  const deals = (state.money?.deals || []).filter(d => d.status === "paid" && ym(d.paid_on) === month).reduce((a, d) => a + Number(d.value), 0);
  const rows = { Merch: o + by("merch"), Sponsors: deals + by("sponsor"), "Creator payouts": by("creator"), Affiliate: by("affiliate"), Other: by("other") };
  return { rows, total: Object.values(rows).reduce((a, b) => a + b, 0) };
}
function moneyView() {
  if (state.money === null || state.settings === null) return `<div class="loading">Loading…</div>`;
  const mv = state.moneyView;
  const head = `<div class="top"><div><div class="mono">VolksVision Studio</div><h1>Money</h1></div></div>`;
  const nav = `<div class="seg" style="grid-template-columns:repeat(5,1fr)" role="group" aria-label="Money sections">${[["overview", "Overview"], ["orders", "Orders"], ["deals", "Deals"], ["income", "Income"], ["kit", "Media kit"]].map(([k, l]) => `<button type="button" data-moneyv="${k}" aria-pressed="${mv === k}">${l}</button>`).join("")}</div>`;
  return head + nav + ({ overview: overviewView, orders: ordersView, deals: dealsView, income: incomeView, kit: kitView })[mv]();
}
function overviewView() {
  const now = new Date(), month = now.toISOString().slice(0, 7), last = new Date(now.getFullYear(), now.getMonth() - 1, 15).toISOString().slice(0, 7);
  const m = moneyByMonth(month), l = moneyByMonth(last), goal = Number(state.settings.incomeGoal) || 0;
  const open = (state.money.deals || []).filter(d => ["signed", "delivered"].includes(d.status)), pipe = (state.money.deals || []).filter(d => ["pitched", "negotiating"].includes(d.status));
  const due = open.filter(d => d.due_on).sort((a, b) => a.due_on.localeCompare(b.due_on)).slice(0, 4);
  const months = [...Array(6)].map((_, i) => { const d = new Date(now.getFullYear(), now.getMonth() - 5 + i, 15); const k = d.toISOString().slice(0, 7); return { key: d.toLocaleDateString("en-US", { month: "short" }), v: moneyByMonth(k).total, count: 0 }; });
  const max = Math.max(goal, ...months.map(x => x.v), 1);
  return `<div class="card" style="border-color:var(--signal)"><div style="display:flex;justify-content:space-between;align-items:flex-end"><div><div class="mono">${now.toLocaleDateString("en-US", { month: "long" })} so far</div><b style="font-size:34px">${usd(m.total)}</b></div>
      <div style="text-align:right"><div class="mono">Goal</div><b style="font-size:20px">${usd(goal)}</b></div></div>
    ${goal ? `<div class="progress" role="img" aria-label="${Math.round(m.total / goal * 100)}% of monthly goal"><span style="width:${Math.min(100, m.total / goal * 100)}%"></span></div>` : ""}
    <span class="r-sub">Last month: ${usd(l.total)}</span></div>
  <div class="card" style="margin-top:12px"><strong>Where it came from this month</strong>${bars(Object.entries(m.rows).map(([key, v]) => ({ key, v, count: "" })), "v", usd)}</div>
  <div class="card" style="margin-top:12px"><div style="display:flex;justify-content:space-between"><strong>Last 6 months</strong><span class="mono">dashed = goal</span></div>
    <div style="display:flex;align-items:flex-end;gap:8px;height:120px;border-bottom:1px solid var(--rule);position:relative" role="img" aria-label="Income per month">
      ${goal ? `<span style="position:absolute;left:0;right:0;bottom:${goal / max * 100}%;border-top:1px dashed var(--muted)"></span>` : ""}
      ${months.map(x => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px"><span class="mono" style="font-size:10px;color:var(--ink)">${x.v ? usd(x.v) : ""}</span><span style="width:100%;max-width:34px;height:${x.v / max * 85}%;background:var(--signal);border-radius:4px 4px 0 0"></span></div>`).join("")}
    </div><div style="display:flex;gap:8px">${months.map(x => `<span class="mono" style="flex:1;text-align:center;font-size:10px">${x.key}</span>`).join("")}</div></div>
  <div class="stats" style="margin-top:12px"><div class="stat"><span class="mono">Signed, not paid</span><b>${usd(open.reduce((a, d) => a + Number(d.value), 0))}</b><span class="r-sub" style="font-size:12px">${open.length} deal${open.length === 1 ? "" : "s"}</span></div>
    <div class="stat"><span class="mono">In talks</span><b>${usd(pipe.reduce((a, d) => a + Number(d.value), 0))}</b><span class="r-sub" style="font-size:12px">${pipe.length} pitch${pipe.length === 1 ? "" : "es"}</span></div></div>
  ${due.length ? `<div class="card" style="margin-top:12px"><strong>Owed to brands</strong>${due.map(d => `<button class="row" type="button" data-deal="${d.id}" style="grid-template-columns:minmax(0,1fr) auto"><span class="r-main"><strong>${esc(d.brand)}</strong><span class="r-sub">${esc(d.deliverables || "Deliverables not set")}</span></span><span class="r-end">${esc(d.due_on)}</span></button>`).join("")}</div>` : ""}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><button class="btn" type="button" data-act="new-deal">+ Deal</button><button class="btn" type="button" data-act="new-income">+ Income</button></div>`;
}
function dealsView() {
  const d = state.money.deals;
  return `<div class="list">${DEAL_STAGES.map(([k, l]) => { const xs = d.filter(x => x.status === k); return xs.length ? `<div class="mono week-h">${l} · ${usd(xs.reduce((a, x) => a + Number(x.value), 0))}</div>` + xs.map(x => `<button class="row" type="button" data-deal="${x.id}" style="grid-template-columns:minmax(0,1fr) auto">
      <span class="r-main"><strong>${esc(x.brand)}</strong><span class="r-sub">${esc(x.deliverables || x.product || "")}</span></span><span class="r-end">${usd(x.value)}${x.due_on && !["paid", "lost"].includes(k) ? `<span class="mono" style="font-size:11px">due ${esc(x.due_on)}</span>` : ""}</span></button>`).join("") : ""; }).join("")
    || `<div class="empty">No deals yet. Brand inquiries from the site show up in More → Pit Crew, where one tap turns them into a deal. Or add a deal you pitched yourself.</div>`}</div>
  <button class="btn solid fab" type="button" data-act="new-deal">+ Deal</button>`;
}
function editDeal(x, prefill) {
  const isNew = !x; x = x || { brand: "", contact: "", email: "", status: "pitched", value: "", product: "", deliverables: "", due_on: "", notes: "", ...(prefill || {}) };
  sheet(isNew ? "New deal" : x.brand, `
    <label class="field" for="dl-brand"><span>Brand</span><input id="dl-brand" value="${esc(x.brand)}"></label>
    <div class="field"><span>Stage</span><div class="chips" style="flex-wrap:wrap">${DEAL_STAGES.map(([k, l]) => `<button class="chip" type="button" data-pick="dstage" data-val="${k}" aria-pressed="${k === x.status}">${l}</button>`).join("")}</div></div>
    <div class="pair"><label class="field" for="dl-value"><span>Cash value ($)</span><input id="dl-value" inputmode="decimal" value="${esc(x.value)}"></label>
    <label class="field" for="dl-due"><span>Content due</span><input id="dl-due" type="date" value="${esc(x.due_on || "")}"></label></div>
    <label class="field" for="dl-product"><span>Gifted product (if any)</span><input id="dl-product" value="${esc(x.product)}"></label>
    <label class="field" for="dl-deliv"><span>What you owe them</span><textarea id="dl-deliv" rows="3" placeholder="1 TikTok + 1 Reel, tag @brand, link in bio for 7 days">${esc(x.deliverables)}</textarea><small>Remember #ad on every sponsored post.</small></label>

    return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
      <button class="card" type="button" data-goto="build" style="text-align:left;cursor:pointer;color:inherit;font:inherit"><span class="mono">The Mk2 · ${esc(b?.status || "In the build")}</span><b style="font-size:22px">${done}/${st.length} stages</b><span class="r-sub" style="white-space:normal">${nx ? `Next: ${esc(nx.name)}` : "All done 🔥"}</span></button>
      <button class="card" type="button" data-goto="stops" style="text-align:left;cursor:pointer;color:inherit;font:inherit"><span class="mono">Next stop</span>${ev ? `<b style="font-size:16px;line-height:1.2">${esc(ev.title)}</b><span class="r-sub" style="white-space:normal">${new Date(ev.starts_at).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })} · ${ev.pullups} pulling up</span>` : `<b style="font-size:16px">Nothing set</b><span class="r-sub" style="white-space:normal">Add your next meet or shoot</span>`}</button>
    </div>`; })()}

  </div>
  ${nudges.length ? `<div class="list" style="margin-top:16px">${nudges.map(([t, go]) => `<button class="row" type="button" data-nudge="${go}" style="grid-template-columns:minmax(0,1fr) auto"><span class="r-main"><strong style="white-space:normal">${esc(t)}</strong></span><span class="r-end">›</span></button>`).join("")}</div>` : ""}

        : `<span class="r-sub" style="white-space:normal">Log a few videos, then get coaching built on what top car creators do, tuned to your numbers.</span><button class="btn" type="button" data-gv="stats">Go to Stats</button>`}</div>
  <div class="card" style="margin-top:16px"><div style="display:flex;justify-content:space-between"><div class="mono">Milestones</div><span class="mono">${got.length}/${ms.length}</span></div>

const fmtN = x => { x = Number(x) || 0; return x >= 1e6 ? (x / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : x >= 1e4 ? Math.round(x / 1e3) + "K" : x >= 1e3 ? (x / 1e3).toFixed(1).replace(/\.0$/, "") + "K" : String(x); };
function videosView() {
  const v = state.videos;

  <div class="list">${v.map(x => { const s = score(x); return `<button class="row" type="button" data-video="${x.id}">
    <span class="thumb mono" style="font-size:10px">${esc(x.platform.slice(0, 2).toUpperCase())}</span>

    <span class="r-end">${fmtN(x.views)} views<span class="mono" style="font-size:11px">${s.follows1k.toFixed(1)} follows/1K</span></span></button>`; }).join("")

  <button class="btn solid fab" type="button" data-act="new-video">+ Log video</button>`;
}

    <div class="mono" style="margin-top:4px">Numbers from the app's analytics · "12.5k" works</div>
    <div class="pair">${num("views", "Views", x.views)}${num("likes", "Likes", x.likes)}</div>
    <div class="pair">${num("comments", "Comments", x.comments)}${num("shares", "Shares", x.shares)}</div>

    <label class="field" for="v-notes"><span>Notes</span><textarea id="v-notes" rows="3" placeholder="What people said, what you'd change">${esc(x.notes)}</textarea></label>

// ---------- Stats + coach ----------
function bars(rows, metric, fmt) {
  const max = Math.max(...rows.map(r => r[metric]), 0.0001);
  return `<div style="display:flex;flex-direction:column;gap:8px">${rows.map(r => `<div style="display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px">
    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.key)}</span>
    <span style="height:12px;background:var(--rule);border-radius:4px;overflow:hidden"><span style="display:block;height:100%;width:${r[metric] > 0 ? Math.max(2, r[metric] / max * 100) : 0}%;background:var(--signal);border-radius:0 4px 4px 0"></span></span>
    <span class="mono" style="font-size:12px;color:var(--ink)">${fmt(r[metric])}${r.count !== "" && r.count != null ? ` <span style="color:var(--muted)">(${r.count})</span>` : ""}</span></div>`).join("")}</div>`;
}
function statsView() {
  const a = analyze(state.videos, { targetPerWeek: goal() });

  const ch = a.recent.prevCount >= 3 ? Math.round((a.recent.views / Math.max(1, a.recent.prevViews) - 1) * 100) : null;
  const breakdown = (title, rows) => rows.length ? `<div class="card"><div style="display:flex;justify-content:space-between"><strong>${title}</strong><span class="mono">follows / 1K views</span></div>${bars(rows, "follows1k", f1)}</div>` : "";
  const weeks = a.weekly.length ? `<div class="card"><div style="display:flex;justify-content:space-between"><strong>Videos per week</strong><span class="mono">goal ${goal()}</span></div>
    <div style="display:flex;align-items:flex-end;gap:6px;height:110px;border-bottom:1px solid var(--rule);position:relative" role="img" aria-label="Videos posted per week">
      <span style="position:absolute;left:0;right:0;bottom:${Math.min(100, goal() / Math.max(goal(), ...a.weekly.map(w => w.posts)) * 100)}%;border-top:1px dashed var(--muted)"></span>
      ${a.weekly.map(w => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end"><span class="mono" style="font-size:11px;color:var(--ink)">${w.posts}</span><span style="width:100%;max-width:28px;height:${w.posts / Math.max(goal(), ...a.weekly.map(x => x.posts)) * 80}%;background:${w.posts >= goal() ? "var(--signal)" : "var(--muted)"};border-radius:4px 4px 0 0"></span></div>`).join("")}
    </div><div style="display:flex;gap:6px">${a.weekly.map(w => `<span class="mono" style="flex:1;text-align:center;font-size:10px">${w.week.slice(5).replace("-", "/")}</span>`).join("")}</div></div>` : "";
  return `
  <div class="card" style="border-color:var(--signal)"><div style="display:flex;justify-content:space-between;align-items:center"><div class="mono">Weekly coach</div>${c ? `<span class="pill">${esc(c.verdict)}</span>` : ""}</div>
    ${c ? coachReport(state.coach[0]) : `<span class="r-sub" style="white-space:normal">Your coach studies your numbers against what the top car creators do and tells you exactly what to change next week. It runs every Sunday on its own.</span>`}
    <button class="btn ${c ? "" : "sea"}" type="button" data-act="coach">${c ? "Get fresh coaching" : "Get my first coaching"}</button></div>
  <div class="stats" style="margin-top:16px">
    ${tile("Views, 90 days", fmtN(a.totals.views), `${a.measured} videos with numbers`)}
    ${tile("New followers", fmtN(a.totals.follows), "from logged videos")}
    ${tile("Avg views, 4 wks", fv(a.recent.views), ch == null ? "" : `${ch >= 0 ? "+" : ""}${ch}% vs 4 wks before`)}
    ${tile("Follows / 1K", f1(a.recent.follows1k), "how fast viewers become crew")}

  ${a.moves.length ? `<div class="card"><strong>Adjust this week</strong>${a.moves.map(m => `<div class="check"><span class="dot"></span><span>${esc(m.text)}</span></div>`).join("")}</div>` : ""}

  ${breakdown("By pillar", a.byPillar)}
  ${breakdown("By opening", a.byHook)}
  ${breakdown("By length", a.byLength)}

  ${breakdown("By platform", a.byPlatform)}
  ${a.top.length ? `<div class="card"><strong>Your crew-builders</strong><span class="r-sub" style="white-space:normal">Ranked by follows, comments, shares and saves per view, not just views.</span>
    ${a.top.map((v, i) => `<button class="row" type="button" data-video="${v.id}" style="grid-template-columns:auto minmax(0,1fr) auto"><span class="mono">#${i + 1}</span><span class="r-main"><strong>${esc(v.title || v.url || "Untitled")}</strong><span class="r-sub">${esc(v.platform)} · ${esc(v.pillar || "no pillar")}</span></span><span class="r-end">${fmtN(v.views)}<span class="mono" style="font-size:11px">${v.s.follows1k.toFixed(1)} f/1K</span></span></button>`).join("")}</div>` : ""}
  <div style="margin-top:20px"><div class="mono" style="margin-bottom:8px">Account numbers</div>${numbersView()}</div>`;
}

// Offline answers: score the guide and FAQ by shared words.
function searchGuide(q) {
  const words = q.toLowerCase().match(/[a-z0-9]{3,}/g) || [];
  const stop = new Set(["how", "the", "and", "can", "what", "does", "where", "when", "with", "for", "you", "my", "this", "that", "into", "get"]);
  const ws = words.filter(w => !stop.has(w));
  const score = t => { const s = t.toLowerCase(); return ws.reduce((n, w) => n + (s.includes(w) ? 1 : 0), 0); };
  const items = [...FAQ.map(([q2, a, k]) => ({ title: q2, text: a, key: k, s: score(q2 + " " + a) * 1.2 })),
    ...Object.entries(HELP).map(([k, [t, steps]]) => ({ title: t, steps, key: k, s: score(t + " " + steps.join(" ")) }))];
  return items.filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 3);
}

async function shrink(file) {
  // Phone photos are 3-12 MB. Resize to 1600px JPEG so pages stay fast (Core Web Vitals).
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" }).catch(() => null);
  if (!bmp) return file;
  const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.85));
}

    if (act === "add-sponsor") { state.settings.sponsors = [...readSponsors(), { name: "", url: "", tagline: "", disclosure: "", logo: "", show: true }]; render(); }
    if (act === "new-stop") editStop(null);
    if (act === "add-stage") { state.settings = buildBody(); state.settings.build.stages.push({ name: "", done: false }); render(); }
    if (act === "stop-delete") {
      if (t.dataset.confirm !== "1") { t.dataset.confirm = "1"; t.textContent = "Tap again to delete"; return; }
      await api(`events?id=${t.dataset.id}`, { method: "DELETE" }); state.events = state.events.filter(x => x.id !== +t.dataset.id); closeSheet(); render(); toast("Stop deleted.");
    }
    if (act === "new-income") editIncome(null);
    if (act === "money-delete") {
      if (t.dataset.confirm !== "1") { t.dataset.confirm = "1"; t.textContent = "Tap again to delete"; return; }
      await api(`money?kind=${t.dataset.kind}&id=${t.dataset.id}`, { method: "DELETE" });
      const key = t.dataset.kind === "deal" ? "deals" : "income"; state.money[key] = state.money[key].filter(x => x.id !== +t.dataset.id); closeSheet(); render(); toast("Deleted.");
    }
    if (act === "create") openCreate();
    if (act === "push-on") { t.disabled = true; try { await turnOnPush(); } catch (err) { fail(err); } finally { t.disabled = false; } }
    if (act === "push-off") { try { await turnOffPush(); } catch (err) { fail(err); } }
    if (act === "push-test") { try { const reg = await navigator.serviceWorker.getRegistration("/"); const sub = await reg.pushManager.getSubscription();
      await fetch("/api/push", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: JSON.stringify({ subscription: sub.toJSON(), role: "admin", test: true }) }); toast("Test sent. It should pop up in a few seconds."); } catch (err) { fail(err); } }
    if (act === "thumb") { saveCaps(); openThumb(); }
    if (act === "broadcast") {
      const body = { list: $("#bc-list").value, subject: $("#bc-subject").value, body: $("#bc-body").value, push: $("#bc-push").checked };
      if (t.dataset.confirm !== "1") { t.dataset.confirm = "1"; t.textContent = "Tap again to send to everyone on this list"; return; }
      t.disabled = true; try { const r = await api("broadcast", { method: "POST", body }); toast(`Emailed ${r.sent} ${r.sent === 1 ? "person" : "people"}${body.push ? `, notified ${r.pushed} ${r.pushed === 1 ? "phone" : "phones"}` : ""}.`); $("#bc-subject").value = ""; $("#bc-body").value = ""; } finally { t.disabled = false; t.dataset.confirm = ""; t.textContent = "Send"; }
    }
    if (act === "video-delete") {
      if (t.dataset.confirm !== "1") { t.dataset.confirm = "1"; t.textContent = "Tap again to delete"; return; }
      await api(`videos?id=${t.dataset.id}`, { method: "DELETE" }); state.videos = state.videos.filter(v => v.id !== +t.dataset.id); closeSheet(); render(); toast("Deleted.");
    }
    if (act === "yt-sync") { toast("Syncing YouTube…"); const r = await api("youtube", { method: "POST" }); state.videos = await api("videos"); render(); toast(`Synced ${r.synced} YouTube videos${r.subscribers != null ? ` · ${fmtN(r.subscribers)} subscribers` : ""}.`); }
    if (act === "coach") {
      t.disabled = true; t.textContent = "Coach is reading your numbers… (about 30 sec)";
      try {
        const r = await api("coach", { method: "POST" });
        if (r.pending) {   // runs in the background; check every 5 seconds for up to 3 minutes
          const before = state.coach[0]?.id;
          for (let i = 0; i < 36; i++) { await new Promise(ok => setTimeout(ok, 5000)); const list = await api("coach"); if (list[0] && list[0].id !== before) { state.coach = list; break; } }
          if (state.coach[0]?.id === before) throw new Error("The coach is taking a while. Check back in a few minutes.");
        } else state.coach = [r, ...state.coach];
        render(); toast("Fresh coaching is in.");
      }
      finally { t.disabled = false; }
    }
    if (act === "coach-ideas") {
      const r = state.coach.find(x => x.id === +t.dataset.id).report;
      const items = [...r.next_week.map(x => ({ title: x.idea, pillar: x.pillar, platform: "TikTok", body: `Open with: ${x.hook}` })), ...r.new_ideas.map(x => ({ ...x, body: "" }))];
      let sort = (planOf("idea").at(-1)?.sort || 0) + 1;
      for (const x of items) await savePlan({ kind: "idea", title: x.title, body: x.body, data: { pillar: x.pillar, platform: x.platform, stage: "idea", link: "" }, sort: sort++ }, { quiet: true });
      toast(`Added ${items.length} ideas. Find them in Ideas.`); t.disabled = true;
    }
    if (act === "coach-tasks") {
      const r = state.coach.find(x => x.id === +t.dataset.id).report;
      const start = state.plan.filter(x => x.kind === "task").reduce((m, x) => Math.max(m, x.data.week || 1), 1);
      let sort = (planOf("task").at(-1)?.sort || 0) + 1;
      for (const x of r.next_week) await savePlan({ kind: "task", title: `${x.day}: ${x.idea}`, data: { week: start }, sort: sort++ }, { quiet: true });
      toast(`Added ${r.next_week.length} tasks to week ${start}.`); t.disabled = true;
    }
    if (act === "plan-import") { state.plan = await api("plan", { method: "POST", body: { import: true } }); render(); toast("Your starter plan is loaded. Edit anything."); }
    if (act === "new-sec") editSection(null);
    if (act === "new-task") editTask(null);
    if (act === "new-idea") editIdea(null);
    if (act === "plan-delete") {
      if (t.dataset.confirm !== "1") { t.dataset.confirm = "1"; t.textContent = t.textContent.length > 2 ? "Tap again to delete" : "Sure?"; return; }
      await api(`plan?id=${t.dataset.id}`, { method: "DELETE" });
      state.plan = state.plan.filter(x => x.id !== +t.dataset.id); if (!$("#sheet").hidden) closeSheet(); render(); toast("Deleted.");
    }
    if (act === "add-spec") { state.settings = buildBody(); state.settings.build.specs.push({ label: "", value: "" }); render(); document.querySelector("[data-spec-l]:last-of-type")?.focus(); }
    if (act === "add-video") {
      const v = $("#v-url").value.trim();
      if (!/^https:\/\/(www\.|m\.|vm\.)?(tiktok\.com|youtube\.com|youtu\.be|instagram\.com)\//.test(v)) return toast("Paste a TikTok, YouTube or Instagram link.", true);
      state.settings = { ...buildBody(), videos: [v, ...(state.settings.videos || [])].slice(0, 12) }; render(); toast("Video added. Tap Save to put it on the site.");
    }
    if (act === "export-subs") {
      const csv = ["email,source,signed_up", ...state.audience.subscribers.map(x => [x.email, x.source, x.created_at].map(csvCell).join(","))].join("\n");
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `volksvision-drop-list-${today()}.csv`; a.click();
    }
    if (act === "add-topic") {
      const title = $("#t-title").value.trim(); if (!title) return toast("Type a post idea first.", true);
      state.settings = { ...settingsBody(), topics: [...(state.settings.topics || []), { title, keyword: $("#t-keyword").value.trim() || title.toLowerCase(), angle: "" }] };
      render(); toast("Idea added. Tap Save settings to keep it.");
    }
    if (act === "publish") { const { live } = await api("publish", { method: "POST" }); toast(live ? "Refreshing. Live in about a minute." : "Site refresh isn't set up yet (deploy hook missing)."); }
    if (act === "lock") lock();
    if (act === "tips-reset") { tipStore.set("vv-tips-off", false); tipStore.set("vv-tips-seen", []); toast("Tips are back on."); }
    if (act === "export") {
      const cols = ["order_number", "created_at", "status", "customer_name", "customer_contact", "ship_to", "total", "tracking", "notes"];
      const csv = [cols.join(","), ...state.orders.map(o => cols.map(c => csvCell(o[c])).join(","))].join("\n");
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
      a.download = `volksvision-orders-${today()}.csv`; a.click();
    }
  } catch (err) { fail(err); }
});
document.addEventListener("input", e => {
  if (e.target.id === "ed-start" || e.target.id === "ed-end") { readEditor(); $("#ed-start-l").textContent = cf.start.toFixed(1) + "s"; $("#ed-end-l").textContent = cf.end.toFixed(1) + "s"; drawFrame(); }
  if (e.target.id === "ed-hook" || e.target.id === "ed-badge") { readEditor(); drawFrame(); }
  if (e.target.id === "th-text" || e.target.id === "th-sub") drawThumb();
  if (e.target.id === "th-at") { cf.thumbAt = +e.target.value; $("#th-at-l").textContent = cf.thumbAt.toFixed(1) + "s"; drawThumb(); }
});
document.addEventListener("change", async e => {
  if (e.target.matches("[data-upload]")) upload(e.target);
  if (e.target.id === "gal-file") addGallery(e.target);
  if (e.target.id === "ed-file" && e.target.files[0]) loadClip(e.target.files[0]).catch(fail);
  if (e.target.id === "th-file" && e.target.files[0]) { const img = new Image(); img.onload = () => { cf.thumbImg = img; drawThumb(); }; img.src = URL.createObjectURL(e.target.files[0]); }
  if (["ed-start", "ed-end", "ed-mark"].includes(e.target.id)) { readEditor(); drawFrame(); }
  if (e.target.matches("[data-tick]")) {
    const tsk = planOf("task").find(x => x.id === +e.target.dataset.tick);
    try { await savePlan({ ...tsk, done: e.target.checked }, { quiet: true }); } catch (err) { e.target.checked = !e.target.checked; fail(err); }
  }
  if (e.target.matches("[data-inq]")) {
    try { const row = await api("audience", { method: "PATCH", body: { id: +e.target.dataset.inq, status: e.target.value } });
      state.audience.inquiries = state.audience.inquiries.map(i => i.id === row.id ? row : i); toast("Inquiry updated."); } catch (err) { fail(err); }
  }
});
document.addEventListener("submit", async e => {
  if (e.target.id === "loginForm") {
    e.preventDefault(); token = $("#token").value.trim();
    try { await api("orders").then(d => { state.orders = d; }); store.set("vv-admin", token, $("#remember").checked); start(); }
    catch (err) { if (err.message !== "locked") $("#loginErr").textContent = err.message; }
  }
  if (e.target.id === "kitForm") {
    e.preventDefault();
    const lines = v => v.split("\n").map(x => x.trim()).filter(Boolean);
    const body = { ...state.settings, sponsors: readSponsors(), incomeGoal: $("#mk-goal").value, mediaKit: { showNumbers: $("#mk-show").checked, pitch: $("#mk-pitch").value, audience: $("#mk-aud").value, services: lines($("#mk-svc").value), partners: lines($("#mk-partners").value) } };
    try { const { settings, live } = await api("settings", { method: "PUT", body }); state.settings = { ...state.settings, ...settings, text: state.settings.text }; render(); toast(savedMsg(live)); } catch (err) { fail(err); }
    return;
  }
  if (e.target.id === "textForm") {
    e.preventDefault();
    const text = Object.fromEntries(TEXT_FIELDS.map(([k]) => [k, $("#tx-" + k).value]));
    try { const { settings, live } = await api("settings", { method: "PUT", body: { ...state.settings, text } }); state.settings = { ...state.settings, ...settings, text: { ...state.settings.text, ...settings.text } }; render(); toast(savedMsg(live)); }
    catch (err) { fail(err); }
    return;
  }
  if (e.target.id === "numForm") {
    e.preventDefault();
    const n = id => $(id).value.trim() === "" ? null : Number($(id).value.replace(/[^0-9]/g, ""));
    try { await savePlan({ kind: "metric", data: { date: $("#n-date").value, tiktok: n("#n-tt"), instagram: n("#n-ig"), youtube: n("#n-yt"), posts: n("#n-posts"), sales: n("#n-sales") } }, { quiet: true }); toast("Numbers saved. See you next Sunday."); }
    catch (err) { fail(err); }
    return;
  }
  if (e.target.id === "buildForm") {
    e.preventDefault();
    const body = buildBody();
    if (body.heroImage && !body.heroAlt.trim()) return toast("Describe the homepage photo first.", true);
    const btn = e.target.querySelector("[type=submit]"); btn.disabled = true;
    try { const { settings, live } = await api("settings", { method: "PUT", body }); state.settings = { ...state.settings, ...settings }; render(); toast(savedMsg(live)); }
    catch (err) { fail(err); } finally { btn.disabled = false; }
  }
  if (e.target.id === "settingsForm") {
    e.preventDefault();
    const btn = e.target.querySelector("[type=submit]"); btn.disabled = true;
    try { const { settings, live } = await api("settings", { method: "PUT", body: settingsBody() }); state.settings = { ...state.settings, ...settings }; render(); toast(savedMsg(live)); }
    catch (err) { fail(err); } finally { btn.disabled = false; }
  }
});
$("#sheetClose").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (!$("#tipScrim").hidden) return hideTip(); if (!$("#sheet").hidden) closeSheet(); });

function start() {
  $("#loginView").hidden = true; $("#appView").hidden = false;
  const hash = location.hash.slice(1);
  go(["orders", "products", "posts", "build", "grow", "settings"].includes(hash) ? hash : "grow");
  if (state.settings === null) api("settings").then(s => { state.settings = s; }).catch(() => {});
}
token ? start() : lock();
</script>
</body></html>
