# School First reminders for RJ (and review nudges for Cara). See scripts/school-remind.mjs.
# Times are UTC; in Eastern daylight time that's 8:07 a.m. and 3:07 p.m. daily, plus Sunday 7:07 p.m.
name: School First reminders

on:
  schedule:
    - cron: "7 12 * * *"
    - cron: "7 19 * * *"
    - cron: "7 23 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/school-remind.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ORDER_FROM_EMAIL: ${{ secrets.ORDER_FROM_EMAIL }}
          SCHOOL_PARENT_EMAIL: ${{ secrets.SCHOOL_PARENT_EMAIL }}
